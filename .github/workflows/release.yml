name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 scripts/check.py
      - run: python3 scripts/export-public.py
      - run: cp dist/CleanFrame-public-unsigned.wgt CleanFrame-QN90D.wgt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" CleanFrame-QN90D.wgt
          --title "CleanFrame QN90D ${GITHUB_REF_NAME#v}"
          --notes "Install on the TV: TizenBrew Installer > Install from GitHub > NicsunXnus/CleanFrame-QN90D. The .wgt is unsigned; TizenBrew Installer re-signs it with your own Samsung certificate."
