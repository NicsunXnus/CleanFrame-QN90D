name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Read version
        id: version
        run: echo "tag=v$(python3 -c "import json;print(json.load(open('package.json'))['version'])")" >> "$GITHUB_OUTPUT"
      - name: Skip if already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.exists.outputs.skip == 'false'
        run: |
          python3 scripts/check.py
          python3 scripts/export-public.py
          cp dist/CleanFrame-public-unsigned.wgt CleanFrame-QN90D.wgt
      - if: steps.exists.outputs.skip == 'false'
        name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: >
          gh release create "$TAG" CleanFrame-QN90D.wgt --target "$GITHUB_SHA"
          --title "CleanFrame QN90D ${TAG#v}"
          --notes "Install on the TV: TizenBrew Installer > Install from GitHub > NicsunXnus/CleanFrame-QN90D. The .wgt is unsigned; TizenBrew Installer re-signs it with your own Samsung certificate."
