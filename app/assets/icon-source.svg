<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fd3c6"/>
      <stop offset="0.55" stop-color="#1f8fe0"/>
      <stop offset="1" stop-color="#3b4fd8"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- the frame: a TV-shaped picture frame -->
  <rect x="76" y="108" width="360" height="252" rx="34" fill="url(#sky)" stroke="#fff" stroke-width="26"/>
  <!-- a horizon line like the CleanFrame wallpaper -->
  <path d="M100 262c42-34 78-44 112-30s58 26 96 6 70-20 104 4" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="12" stroke-linecap="round"/>
  <!-- the app row -->
  <rect x="122" y="292" width="64" height="44" rx="12" fill="#fff"/>
  <rect x="224" y="292" width="64" height="44" rx="12" fill="#fff" fill-opacity=".8"/>
  <rect x="326" y="292" width="64" height="44" rx="12" fill="#fff" fill-opacity=".8"/>
  <!-- stand -->
  <path d="M196 404h120" stroke="#fff" stroke-width="22" stroke-linecap="round"/>
</svg>
